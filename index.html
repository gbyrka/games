<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script data-site-https>
    (() => {
      const { hostname, search, hash } = location;
      const publicHosts = ['mod-it.games', 'www.mod-it.games', 'gbyrka.github.io'];
      const destination = publicHosts.includes(hostname) ? 'https://mod-it.games/' : '/';
      location.replace(`${destination}${search}${hash}`);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=/"></noscript>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://mod-it.games/">
  <title>MoD-IT Games</title>
</head>
<body>
  <p>The game collection is at <a href="/">mod-it.games</a>.</p>
</body>
</html>
